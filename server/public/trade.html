<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Forex — CryptoTrade</title>
        <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body { background: #0b0e11; color: #eaecef; min-height: 100vh; }

        /* NAV */
        .nav {
            background: #1e2329;
            border-bottom: 1px solid #2b3139;
            padding: 16px 32px;
            display: flex; align-items: center; gap: 24px;
        }
        .nav-logo { font-size: 22px; font-weight: 900; color: #f0b90b; text-decoration: none; }
        .nav-links { display: flex; gap: 8px; flex: 1; }
        .nav-link {
            color: #848e9c; text-decoration: none;
            padding: 8px 16px; border-radius: 8px;
            font-size: 14px; font-weight: 700;
        }
        .nav-link:hover, .nav-link.active { background: #2b3139; color: #eaecef; }
        .nav-user { display: flex; align-items: center; gap: 12px; }
        .user-email { font-size: 13px; color: #848e9c; }
        .logout-btn {
            background: transparent; color: #f6465d;
            border: 1px solid #2b3139; padding: 8px 16px;
            border-radius: 8px; font-size: 13px; font-weight: 700;
            cursor: pointer;
        }
        .logout-btn:hover { border-color: #f6465d; }

        /* LAYOUT */
        .trade-container {
            display: grid;
            grid-template-columns: 240px 1fr 300px;
            gap: 16px;
            padding: 16px;
            height: calc(100vh - 73px);
        }

        /* PAIRS SIDEBAR */
        .pairs-sidebar {
            background: #1e2329;
            border: 1px solid #2b3139;
            border-radius: 12px;
            overflow-y: auto;
            padding: 8px;
        }
        .pair-item {
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            color: #848e9c;
            transition: all .2s;
        }
        .pair-item:hover { background: #2b3139; color: #eaecef; }
        .pair-item.active { background: rgba(240,185,11,.12); color: #f0b90b; }
        .pair-price { font-size: 12px; font-weight: 600; color: #eaecef; }
        .pair-change { font-size: 11px; }
        .pair-change.up { color: #0ecb81; }
        .pair-change.down { color: #f6465d; }

        /* CHART AREA */
        .chart-area {
            background: #1e2329;
            border: 1px solid #2b3139;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chart-header {
            padding: 16px 20px;
            border-bottom: 1px solid #2b3139;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chart-symbol { font-size: 20px; font-weight: 900; color: #eaecef; }
        .chart-price { font-size: 28px; font-weight: 900; color: #f0b90b; }
        .chart-change { font-size: 14px; font-weight: 700; margin-left: 8px; }
        .chart-change.up { color: #0ecb81; }
        .chart-change.down { color: #f6465d; }

        #chart { flex: 1; min-height: 0; }

        /* ORDER PANEL */
        .order-panel {
            background: #1e2329;
            border: 1px solid #2b3139;
            border-radius: 12px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .order-tabs { display: flex; gap: 8px; }
        .order-tab {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2b3139;
            background: transparent;
            color: #848e9c;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }
        .order-tab.buy.active { background: #0ecb81; color: #fff; border-color: #0ecb81; }
        .order-tab.sell.active { background: #f6465d; color: #fff; border-color: #f6465d; }

        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #848e9c;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0b0e11;
            border: 1px solid #2b3139;
            border-radius: 8px;
            color: #eaecef;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus { border-color: #f0b90b; }

        .balance-info {
            font-size: 12px;
            color: #848e9c;
            padding: 10px 12px;
            background: #0b0e11;
            border-radius: 8px;
            border: 1px solid #2b3139;
        }
        .balance-info strong { color: #f0b90b; }

        .submit-order {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity .2s;
        }
        .submit-order.buy { background: #0ecb81; color: #fff; }
        .submit-order.sell { background: #f6465d; color: #fff; }
        .submit-order:hover { opacity: 0.92; }
        .submit-order:disabled { opacity: 0.5; cursor: not-allowed; }

        .message {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }
        .message.error { display: block; background: rgba(246,70,93,.1); color: #f6465d; }
        .message.success { display: block; background: rgba(14,203,129,.1); color: #0ecb81; }

        @media (max-width: 900px) {
            .trade-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .chart-area { height: 400px; }
            .nav { padding: 14px 16px; flex-wrap: wrap; }
            .nav-links { display: none; }
            .user-email { display: none; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="dashboard.html" class="nav-logo">CryptoTrade</a>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="deposit.html" class="nav-link">Deposit</a>
            <a href="trade.html" class="nav-link active">Trade</a>
            <a href="withdraw.html" class="nav-link">Withdraw</a>
        </div>
        <div class="nav-user">
            <span class="user-email" id="userEmail">—</span>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>
    </nav>

    <div class="trade-container">

        <!-- PAIRS SIDEBAR -->
        <div class="pairs-sidebar" id="pairsList">
            <div style="padding:20px;text-align:center;color:#848e9c;">Loading...</div>
        </div>

        <!-- CHART -->
        <div class="chart-area">
            <div class="chart-header">
                <div>
                    <div class="chart-symbol" id="chartSymbol">EUR/USD</div>
                    <div class="chart-price" id="chartPrice">—</div>
                </div>
                <div class="chart-change" id="chartChange"></div>
            </div>
            <div id="chart"></div>
        </div>

        <!-- ORDER PANEL -->
        <div class="order-panel">
            <div class="order-tabs">
                <button class="order-tab buy active" onclick="setSide('buy')">Buy</button>
                <button class="order-tab sell" onclick="setSide('sell')">Sell</button>
            </div>

            <div class="balance-info">
                Available USDT: <strong id="balanceUsdt">0.00</strong>
            </div>

            <div class="form-group">
                <label>Amount (USDT)</label>
                <input type="number" id="amount" placeholder="Enter amount" step="any" min="1">
            </div>

            <button class="submit-order buy" id="submitBtn" onclick="submitOrder()">Buy EUR/USD</button>

            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        const headers = { 'Authorization': 'Bearer ' + token };

        const PAIRS = [
            { symbol: 'EURUSD', display: 'EUR/USD' },
            { symbol: 'GBPUSD', display: 'GBP/USD' },
            { symbol: 'USDJPY', display: 'USD/JPY' },
            { symbol: 'USDCHF', display: 'USD/CHF' },
            { symbol: 'AUDUSD', display: 'AUD/USD' },
            { symbol: 'USDCAD', display: 'USD/CAD' },
            { symbol: 'NZDUSD', display: 'NZD/USD' },
            { symbol: 'EURGBP', display: 'EUR/GBP' },
            { symbol: 'USDZAR', display: 'USD/ZAR' },
            { symbol: 'XAUUSD', display: 'XAU/USD' }
        ];

        let currentPair = 'EURUSD';
        let currentSide = 'buy';
        let prices = {};
        let balances = { USDT: 0 };
        let chart = null;
        let candleSeries = null;

        // Init chart
        function initChart() {
            const container = document.getElementById('chart');
            chart = LightweightCharts.createChart(container, {
                layout: { background: { color: '#1e2329' }, textColor: '#848e9c' },
                grid: {
                    vertLines: { color: '#2b3139' },
                    horzLines: { color: '#2b3139' }
                },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { borderColor: '#2b3139', timeVisible: true },
                rightPriceScale: { borderColor: '#2b3139' }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#0ecb81',
                downColor: '#f6465d',
                borderUpColor: '#0ecb81',
                borderDownColor: '#f6465d',
                wickUpColor: '#0ecb81',
                wickDownColor: '#f6465d'
            });
        }

        async function loadPrices() {
            try {
                const res = await fetch('/api/forex/prices');
                const data = await res.json();
                if (data.ok) {
                    prices = data.prices;
                    renderPairs();
                    updateChartHeader();
                }
            } catch (err) { console.error(err); }
        }

        function renderPairs() {
            const list = document.getElementById('pairsList');
            list.innerHTML = PAIRS.map(p => {
                const price = prices[p.symbol] || 0;
                const isActive = p.symbol === currentPair;
                return `
                    <div class="pair-item ${isActive ? 'active' : ''}"
                         onclick="selectPair('${p.symbol}')">
                        <span>${p.display}</span>
                        <span class="pair-price">${formatPrice(p.symbol, price)}</span>
                    </div>
                `;
            }).join('');
        }

        function formatPrice(symbol, price) {
            if (!price) return '—';
            if (symbol === 'XAUUSD') return price.toFixed(2);
            if (symbol.includes('JPY')) return price.toFixed(3);
            return price.toFixed(5);
        }

        function updateChartHeader() {
            const p = PAIRS.find(x => x.symbol === currentPair);
            const price = prices[currentPair] || 0;
            document.getElementById('chartSymbol').textContent = p ? p.display : currentPair;
            document.getElementById('chartPrice').textContent = formatPrice(currentPair, price);
        }

        async function selectPair(symbol) {
            currentPair = symbol;
            renderPairs();
            updateChartHeader();
            updateSubmitBtn();
            await loadCandles();
        }

        async function loadCandles() {
            try {
                const res = await fetch(`/api/forex/candles/${currentPair}?interval=1h&limit=200`);
                const data = await res.json();
                if (data.ok && data.candles) {
                    candleSeries.setData(data.candles);
                    chart.timeScale().fitContent();
                }
            } catch (err) { console.error('Candles error:', err); }
        }

        function setSide(side) {
            currentSide = side;
            document.querySelectorAll('.order-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.order-tab.${side}`).classList.add('active');
            updateSubmitBtn();
        }

        function updateSubmitBtn() {
            const p = PAIRS.find(x => x.symbol === currentPair);
            const btn = document.getElementById('submitBtn');
            btn.textContent = (currentSide === 'buy' ? 'Buy ' : 'Sell ') + (p ? p.display : currentPair);
            btn.className = 'submit-order ' + currentSide;
        }

        async function submitOrder() {
            const amount = document.getElementById('amount').value;
            const msg = document.getElementById('message');
            const btn = document.getElementById('submitBtn');

            if (!amount || Number(amount) <= 0) {
                msg.className = 'message error';
                msg.textContent = 'Enter a valid amount';
                return;
            }

            btn.disabled = true;
            msg.className = 'message';

            try {
                const res = await fetch('/api/forex/trade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...headers },
                    body: JSON.stringify({ pair: currentPair, side: currentSide, amount: Number(amount) })
                });
                const data = await res.json();

                if (data.ok) {
                    msg.classList.add('success');
                    msg.textContent = `✅ ${currentSide.toUpperCase()} order placed at ${formatPrice(currentPair, data.price)}`;
                    document.getElementById('amount').value = '';
                    balances.USDT = data.balances.USDT;
                    document.getElementById('balanceUsdt').textContent = Number(balances.USDT).toFixed(2);
                } else {
                    msg.classList.add('error');
                    msg.textContent = data.error || 'Trade failed';
                }
            } catch (err) {
                msg.classList.add('error');
                msg.textContent = 'Network error';
            } finally {
                btn.disabled = false;
            }
        }

        async function loadMe() {
            try {
                const res = await fetch('/api/me', { headers });
                const data = await res.json();
                if (data.ok) {
                    document.getElementById('userEmail').textContent = data.user.email;
                    balances = data.user.balances || { USDT: 0 };
                    document.getElementById('balanceUsdt').textContent = Number(balances.USDT).toFixed(2);
                }
            } catch (err) { console.error(err); }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Init
        initChart();
        loadMe();
        loadPrices().then(() => {
            selectPair('EURUSD');
        });
        setInterval(loadPrices, 10000);
    </script>
</body>
</html>

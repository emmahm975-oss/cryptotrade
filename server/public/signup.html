<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — CryptoTrade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body { background: #0b0e11; color: #eaecef; min-height: 100vh;
               display: flex; flex-direction: column; }

        .nav {
            background: #1e2329;
            border-bottom: 1px solid #2b3139;
            padding: 16px 32px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-size: 22px; font-weight: 900; color: #f0b90b;
            text-decoration: none;
        }
        .nav-link {
            color: #eaecef; text-decoration: none;
            padding: 10px 20px; border-radius: 8px;
            font-size: 14px; font-weight: 700;
        }
        .nav-link:hover { background: #2b3139; }

        .main {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
        }
        .card {
            background: #1e2329;
            border: 1px solid #2b3139;
            border-radius: 20px;
            padding: 40px 36px 36px;
            width: 100%; max-width: 420px;
        }
        .card h1 {
            font-size: 26px; font-weight: 900;
            color: #eaecef; text-align: center;
            margin-bottom: 8px;
        }
        .card .sub {
            text-align: center; color: #848e9c;
            font-size: 14px; margin-bottom: 32px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px; font-weight: 700;
            color: #848e9c; margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 16px;
            background: #0b0e11;
            border: 1px solid #2b3139;
            border-radius: 10px;
            color: #eaecef;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color .2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #f0b90b;
        }
        .form-group input::placeholder { color: #5e6673; }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #f0b90b; color: #1e2329;
            border: none; border-radius: 10px;
            font-size: 15px; font-weight: 900;
            letter-spacing: 1px; text-transform: uppercase;
            cursor: pointer; margin-top: 12px;
            transition: opacity .2s, transform .1s;
        }
        .submit-btn:hover:not(:disabled) { opacity: 0.92; }
        .submit-btn:active:not(:disabled) { transform: scale(.99); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .message {
            display: none;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.5;
            margin-top: 16px;
            text-align: center;
        }
        .message.error {
            display: block;
            background: rgba(246,70,93,.1);
            border: 1px solid rgba(246,70,93,.3);
            color: #f6465d;
        }
        .message.success {
            display: block;
            background: rgba(14,203,129,.1);
            border: 1px solid rgba(14,203,129,.3);
            color: #0ecb81;
        }

        .alt-link {
            text-align: center;
            font-size: 14px;
            color: #848e9c;
            margin-top: 24px;
        }
        .alt-link a {
            color: #f0b90b;
            text-decoration: none;
            font-weight: 700;
        }
        .alt-link a:hover { text-decoration: underline; }

        .footer {
            background: #1e2329;
            border-top: 1px solid #2b3139;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #848e9c;
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="/" class="nav-logo">CryptoTrade</a>
        <a href="login.html" class="nav-link">Log In</a>
    </nav>

    <main class="main">
        <div class="card">
            <h1>Create Account</h1>
            <p class="sub">Join CryptoTrade in seconds</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required>
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" required>
                        <option value="">Select country</option>
                        <option value="Kenya">Kenya</option>
                        <option value="Tanzania">Tanzania</option>
                        <option value="Uganda">Uganda</option>
                        <option value="Zambia">Zambia</option>
                        <option value="Zimbabwe">Zimbabwe</option>
                        <option value="Nigeria">Nigeria</option>
                        <option value="South Africa">South Africa</option>
                        <option value="Ghana">Ghana</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6" required>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Sign Up</button>
            </form>

            <div class="message" id="message"></div>

            <p class="alt-link">Already have an account? <a href="login.html">Log In</a></p>
        </div>
    </main>

    <footer class="footer">© 2026 CryptoTrade</footer>

    <script>
        const form = document.getElementById('signupForm');
        const msg = document.getElementById('message');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            msg.className = 'message';
            msg.textContent = '';

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const country = document.getElementById('country').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                msg.classList.add('error');
                msg.textContent = 'Passwords do not match';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating...';

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, phone, country, password })
                });
                const data = await res.json();

                                if (data.ok) {
                    // Redirect immediately to login — do NOT show success message
                    window.location.href = 'login.html';
                } else {
                    msg.classList.add('error');
                    msg.textContent = data.error || 'Signup failed';
                    btn.disabled = false;
                    btn.textContent = 'Sign Up';
                }
            } catch (err) {
                msg.classList.add('error');
                msg.textContent = 'Network error. Try again.';
                btn.disabled = false;
                btn.textContent = 'Sign Up';
            }
        });
    </script>
</body>
</html>
